# Lint scope: ruff's defaults plus import sorting and common bug patterns.
[lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[lint.flake8-bugbear]
# FastAPI's dependency injection puts Depends()/File()/Form() in argument defaults.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.File",
  "fastapi.Form",
  "fastapi.Query",
  "fastapi.Security",
]

[lint.per-file-ignores]
# conftest sets environment variables before importing the app, on purpose.
"tests/conftest.py" = ["E402"]