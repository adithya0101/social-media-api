# Build -> push to Artifact Registry -> deploy to Cloud Run.
#
# Intended to run from a Cloud Build trigger on pushes to main.
# $SHORT_SHA is only populated for triggered builds, so running this file by hand
# with `gcloud builds submit --config` will produce an invalid image tag.
# For a manual bootstrap deploy, see DEPLOYMENT.md ("Option B").
#
# One-time prerequisites (all in DEPLOYMENT.md): Artifact Registry repo, Cloud SQL
# instance, Secret Manager secrets, runtime + build service accounts.

substitutions:
  _REGION: us-central1
  _REPO: social-api
  _SERVICE: social-api
  _SQL_INSTANCE: social-db
  _RUNTIME_SA: social-api-runtime

options:
  # Required when the build runs as a user-specified service account
  # (we use a dedicated one instead of the default).
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:${SHORT_SHA}
      - .

  # Push must be an explicit step. The top-level `images:` field only pushes
  # AFTER all steps finish, which is too late for the deploy step below.
  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:${SHORT_SHA}

  # The full runtime config is declared here (not only the image), so a deploy
  # no longer depends on someone having run a manual first deploy.
  # Note: --set-env-vars replaces ALL plain env vars on the service.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:${SHORT_SHA}
      - --region=${_REGION}
      - --allow-unauthenticated
      - --service-account=${_RUNTIME_SA}@${PROJECT_ID}.iam.gserviceaccount.com
      - --add-cloudsql-instances=${PROJECT_ID}:${_REGION}:${_SQL_INSTANCE}
      - --set-secrets=SECRET_KEY=social-api-secret-key:latest,DATABASE_URL=social-api-database-url:latest
      - --set-env-vars=ALGORITHM=HS256,ACCESS_TOKEN_EXPIRE_MINUTES=30
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=1

# Records the built image on the build for provenance.
images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:${SHORT_SHA}
